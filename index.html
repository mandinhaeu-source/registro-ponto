<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ponto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--s1:#141414;--s2:#1e1e1e;
  --b:rgba(255,255,255,.07);--bs:rgba(255,255,255,.14);
  --text:#f0f0f0;--ts:#777;--tt:#444;
  --green:#1fce7c;--gbg:rgba(31,206,124,.1);--gt:#1fce7c;
  --red:#f0614a;--rbg:rgba(240,97,74,.1);--rt:#f0614a;
  --blue:#4d8ef5;--bbg:rgba(77,142,245,.1);--bt:#4d8ef5;
  --amber:#f5a623;--abg:rgba(245,166,35,.1);--at:#f5a623;
  --indigo:#7c6cf0;--ibg:rgba(124,108,240,.1);--it:#7c6cf0;
  --r:12px;--rl:18px
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem 1rem 5rem}
.wrap{max-width:480px;margin:0 auto}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.app-name{font-size:14px;font-weight:500;color:var(--ts);letter-spacing:.5px;text-transform:uppercase}
.status-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ts)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}

/* TABS */
.tabs{display:flex;background:var(--s1);border:1px solid var(--b);border-radius:var(--r);padding:4px;margin-bottom:1.5rem}
.tab{flex:1;padding:9px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;color:var(--ts);cursor:pointer;transition:all .2s}
.tab.active{background:var(--s2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--b);border-radius:var(--rl);padding:1.5rem;margin-bottom:1rem}
.lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--tt);margin-bottom:12px}

/* USER GRID */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:1.25rem}
.ubtn{padding:12px 8px;border:1px solid var(--b);border-radius:var(--r);background:var(--s2);color:var(--ts);font-size:14px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;text-align:center;transition:all .2s}
.ubtn:hover{border-color:var(--bs);color:var(--text)}
.ubtn.sel{border:1.5px solid var(--blue);background:var(--bbg);color:var(--blue)}

/* INPUT ROW */
.irow{display:flex;gap:8px}
.irow input{flex:1;padding:10px 14px;border:1px solid var(--b);border-radius:var(--r);font-size:14px;font-family:'Inter',sans-serif;background:var(--s2);color:var(--text);outline:none}
.irow input::placeholder{color:var(--tt)}
.irow input:focus{border-color:var(--bs)}
.irow button,.btn-sm{padding:10px 16px;border:1px solid var(--b);border-radius:var(--r);background:var(--s2);font-size:14px;font-family:'Inter',sans-serif;color:var(--ts);cursor:pointer;white-space:nowrap;transition:all .2s}
.irow button:hover,.btn-sm:hover{border-color:var(--bs);color:var(--text)}

/* CLOCK */
.clock-block{text-align:center;padding:2rem 0 1.25rem}
.clock-t{font-family:'DM Mono',monospace;font-size:60px;font-weight:400;color:var(--text);letter-spacing:-3px;line-height:1}
.clock-d{font-size:12px;color:var(--tt);margin-top:8px;letter-spacing:.3px}
.user-greeting{font-size:15px;font-weight:500;color:var(--text);margin-top:1rem}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 14px;border-radius:99px;margin-top:8px}
.pill-out{background:rgba(255,255,255,.05);color:var(--ts)}
.pill-in{background:var(--gbg);color:var(--gt);border:1px solid rgba(31,206,124,.2)}
.pill-almoco{background:var(--abg);color:var(--at);border:1px solid rgba(245,166,35,.2)}
.pill-done{background:rgba(255,255,255,.04);color:var(--tt)}

/* OBS */
.obs-area{margin:12px 0 4px}
.obs-area label{font-size:11px;font-weight:500;color:var(--tt);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.obs-area textarea,.obs-edit textarea{width:100%;padding:10px 14px;border:1px solid var(--b);border-radius:var(--r);font-size:14px;font-family:'Inter',sans-serif;background:var(--s2);color:var(--text);outline:none;resize:none;line-height:1.5}
.obs-area textarea::placeholder{color:var(--tt)}
.obs-area textarea:focus,.obs-edit textarea:focus{border-color:var(--bs)}

/* MAIN BUTTON */
.btn-p{width:100%;padding:16px;border:none;border-radius:var(--r);font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;margin-top:10px;letter-spacing:.2px}
.btn-p:active{transform:scale(.98);opacity:.9}
.bp-entrada{background:var(--green);color:#000}
.bp-almoco{background:var(--amber);color:#000}
.bp-retorno{background:var(--indigo);color:#fff}
.bp-saida{background:var(--red);color:#fff}
.bp-off{background:var(--s2);color:var(--tt);cursor:not-allowed;border:1px solid var(--b)}

/* METRICS */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.metric{background:var(--s1);border:1px solid var(--b);border-radius:var(--rl);padding:1.25rem}
.metric-l{font-size:11px;color:var(--tt);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.metric-v{font-size:30px;font-weight:300;font-family:'DM Mono',monospace;color:var(--text)}

/* REG ITEMS */
.reg-item{padding:12px 0;border-bottom:1px solid var(--b)}
.reg-item:last-child{border-bottom:none}
.reg-top{display:flex;align-items:flex-start;justify-content:space-between}
.reg-name{font-size:14px;font-weight:500;color:var(--text)}
.reg-time{font-size:12px;color:var(--ts);font-family:'DM Mono',monospace;margin-top:2px}
.reg-loc{font-size:11px;color:var(--tt);margin-top:3px}
.reg-acts{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px}
.b-entrada{background:var(--gbg);color:var(--gt)}
.b-saida_almoco{background:var(--abg);color:var(--at)}
.b-retorno_almoco{background:var(--ibg);color:var(--it)}
.b-saida{background:var(--rbg);color:var(--rt)}
.icon-btn{background:none;border:none;color:var(--tt);font-size:14px;cursor:pointer;padding:5px;border-radius:6px;line-height:1;transition:all .15s}
.icon-btn:hover{background:var(--s2);color:var(--text)}
.icon-btn.del:hover{background:var(--rbg);color:var(--red)}
.reg-obs{font-size:11px;color:var(--amber);background:var(--abg);border-radius:6px;padding:4px 10px;margin-top:6px;display:inline-block}
.obs-edit{display:flex;gap:6px;margin-top:8px}
.obs-edit button{padding:7px 12px;border:1px solid var(--b);border-radius:var(--r);background:var(--s2);font-size:13px;font-family:'Inter',sans-serif;color:var(--ts);cursor:pointer;white-space:nowrap}
.obs-edit button:hover{color:var(--text);border-color:var(--bs)}

/* FILTERS */
.filter-row{display:flex;gap:8px;margin-bottom:1rem}
.filter-row select,.filter-row input[type=date]{flex:1;padding:10px 14px;border:1px solid var(--b);border-radius:var(--r);font-size:14px;font-family:'Inter',sans-serif;background:var(--s2);color:var(--text);outline:none;-webkit-appearance:none}
.filter-row select:focus,.filter-row input[type=date]:focus{border-color:var(--bs)}

/* REL ITEMS */
.rel-item{padding:14px 0;border-bottom:1px solid var(--b)}
.rel-item:last-child{border-bottom:none}
.rel-top{display:flex;justify-content:space-between;align-items:center}
.rel-name{font-size:15px;font-weight:500}
.rel-h{font-size:15px;font-weight:500;color:var(--blue);font-family:'DM Mono',monospace}
.rel-d{font-size:12px;color:var(--ts);margin-top:3px}

/* EXPORT BTN */
.btn-exp{width:100%;padding:14px;border:1px solid rgba(31,206,124,.3);border-radius:var(--r);background:var(--gbg);color:var(--green);font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:.2px;transition:all .2s}
.btn-exp:hover{background:rgba(31,206,124,.15)}

/* EMPTY / LOADING */
.empty{text-align:center;padding:2.5rem;color:var(--tt);font-size:14px}
.loading{text-align:center;padding:2.5rem;color:var(--ts);font-size:13px}

/* ADMIN */
.admin-access{display:block;width:100%;text-align:center;margin-top:.75rem;padding:.75rem;border:none;background:none;font-size:12px;font-family:'Inter',sans-serif;color:var(--tt);cursor:pointer;letter-spacing:.3px;transition:color .2s}
.admin-access:hover{color:var(--ts)}
.admin-ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:1.5rem 1rem 4rem;display:none}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.admin-title{font-size:16px;font-weight:600;color:var(--indigo)}
.btn-close{padding:8px 16px;border:1px solid var(--b);border-radius:var(--r);background:var(--s2);font-size:13px;font-family:'Inter',sans-serif;color:var(--ts);cursor:pointer}
.btn-close:hover{color:var(--text);border-color:var(--bs)}
.collab-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b)}
.collab-item:last-child{border-bottom:none}
.collab-name{font-size:14px;font-weight:500}
.collab-pin{font-size:12px;color:var(--ts);margin-top:2px}
.collab-acts{display:flex;gap:6px}

/* PIN MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;display:none}
.modal-box{background:var(--s1);border:1px solid var(--bs);border-radius:var(--rl);padding:2rem 1.5rem;width:100%;max-width:300px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-t{font-size:17px;font-weight:600;margin-bottom:4px;text-align:center}
.modal-s{font-size:13px;color:var(--ts);margin-bottom:1.5rem;text-align:center}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:1.25rem}
.pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--bs);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px var(--blue)}
.pin-err{font-size:12px;color:var(--red);text-align:center;margin-bottom:10px;min-height:16px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nk{padding:18px;border:1px solid var(--b);border-radius:var(--r);background:var(--s2);font-size:20px;font-weight:400;font-family:'DM Mono',monospace;cursor:pointer;transition:all .1s;color:var(--text)}
.nk:hover{border-color:var(--bs);background:#252525}
.nk:active{background:var(--bbg);border-color:var(--blue);transform:scale(.94)}
.nk.nk-sm{font-size:13px;color:var(--ts);font-family:'Inter',sans-serif;font-weight:500}
.modal-cancel{width:100%;margin-top:10px;padding:11px;border:1px solid var(--b);border-radius:var(--r);background:transparent;font-size:13px;font-family:'Inter',sans-serif;color:var(--ts);cursor:pointer}
.modal-cancel:hover{background:var(--s2);color:var(--text)}
</style>
</head>

function pad(n){return String(n).padStart(2,'0');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function normalize(r){return{id:r.id,user:r.user_name,type:r.type,date:r.date,time:r.time,ts:r.ts,obs:r.obs,lat:r.lat,lon:r.lon,acc:r.acc,address:r.address};}

async function init(){
  try{ await loadUsers(); await loadTodayRegs(); setupRealtime(); popFilters(); updateBtn(); setOnline(true); }

async function loadUsers(){
  var res=await db.from('colaboradores').select('name').order('name');
  if(res.error) throw res.error;
  S.users=res.data.map(function(c){return c.name;});
  renderUsers();
}

async function loadTodayRegs(){
  var res=await db.from('registros').select('*').eq('date',todayKey()).order('ts');
  if(res.error) throw res.error;
  S.todayRegs=res.data.map(normalize);
  updateBtn();
  if(currentTab==='hoje') renderHoje();
}

function setupRealtime(){
  db.channel('ponto-rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'registros'},function(p){
      var r=normalize(p.new);
      if(r.date===todayKey()){S.todayRegs=S.todayRegs.filter(function(x){return x.id!==r.id;});S.todayRegs.push(r);S.todayRegs.sort(function(a,b){return a.ts-b.ts;});if(currentTab==='hoje')renderHoje();updateBtn();}
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'registros'},function(p){
      var r=normalize(p.new);S.todayRegs=S.todayRegs.map(function(x){return x.id===r.id?r:x;});if(currentTab==='hoje')renderHoje();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'registros'},function(p){
      S.todayRegs=S.todayRegs.filter(function(x){return x.id!==p.old.id;});if(currentTab==='hoje')renderHoje();updateBtn();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'colaboradores'},function(){loadUsers();})
    .subscribe();
}

function showTab(t){
  currentTab=t;

}

function showAdminTab(t){

  document.querySelectorAll('#admin-ov .tabs .tab').forEach(function(el,i){el.classList.toggle('active',['colab','regs','arel'][i]===t);});

function renderUsers(){

function selectUser(u){
  S.selUser=u;S.verUser=null;renderUsers();updateBtn();

}

function showGreeting(u){
  var g=document.getElementById('greeting');

  else g.innerHTML='<div class="user-greeting" style="color:var(--ts)">'+esc(u)+'</div>';
}

function getNextType(user){
  var regs=S.todayRegs.filter(function(r){return r.user===user;});
  if(!regs.length) return 'entrada';
  var last=regs[regs.length-1].type;
  if(last==='entrada') return 'saida_almoco';
  if(last==='saida_almoco') return 'retorno_almoco';
  if(last==='retorno_almoco') return 'saida';
  return null;
}

function getLastType(user){
  var regs=S.todayRegs.filter(function(r){return r.user===user;});
  return regs.length?regs[regs.length-1].type:null;
}

function updateBtn(){
  var btn=document.getElementById('btn-ponto');
  var sd=document.getElementById('status-d');
  var gr=document.getElementById('greeting');
  if(!S.verUser){
    btn.className='btn-p bp-off';
    btn.textContent=S.selUser?'Aguardando PIN...':'Selecione quem está registrando';
    sd.innerHTML='';
    if(!S.selUser&&gr) gr.innerHTML='';
    return;
  }
  var next=getNextType(S.verUser);
  var last=getLastType(S.verUser);
  if(!next){
    btn.className='btn-p bp-off';btn.textContent='Jornada encerrada';
    sd.innerHTML='<span class="status-pill pill-done">Jornada encerrada ✓</span>';return;
  }
  btn.className='btn-p '+TC[next];
  btn.textContent=TB[next];
  if(!last) sd.innerHTML='<span class="status-pill pill-out">Fora do trabalho</span>';
  else if(last==='entrada'||last==='retorno_almoco') sd.innerHTML='<span class="status-pill pill-in">● Em serviço</span>';
  else if(last==='saida_almoco') sd.innerHTML='<span class="status-pill pill-almoco">🍽 Em almoço</span>';
}

function registrarPonto(){
  if(!S.verUser) return;
  var next=getNextType(S.verUser);
  if(!next) return;
  var btn=document.getElementById('btn-ponto');
  btn.disabled=true;btn.textContent='📍 Obtendo localização...';
  function doReg(lat,lon,acc){
    var n=new Date();
    var reg={id:Date.now(),user:S.verUser,type:next,date:todayKey(),time:pad(n.getHours())+':'+pad(n.getMinutes()),ts:n.getTime(),obs:document.getElementById('obs-in').value.trim(),lat:lat,lon:lon,acc:acc,address:null};
    btn.textContent='💾 Salvando...';
    function finalizar(addr){
      reg.address=addr;
      db.from('registros').insert({id:reg.id,user_name:reg.user,type:reg.type,date:reg.date,time:reg.time,ts:reg.ts,obs:reg.obs||null,lat:reg.lat||null,lon:reg.lon||null,acc:reg.acc||null,address:reg.address||null}).then(function(res){
        if(res.error){alert('Erro ao salvar: '+res.error.message);btn.disabled=false;updateBtn();return;}
        // Atualiza cache local imediatamente sem esperar realtime
        S.todayRegs=S.todayRegs.filter(function(x){return x.id!==reg.id;});
        S.todayRegs.push(normalize({id:reg.id,user_name:reg.user,type:reg.type,date:reg.date,time:reg.time,ts:reg.ts,obs:reg.obs||null,lat:reg.lat||null,lon:reg.lon||null,acc:reg.acc||null,address:reg.address||null}));
        S.todayRegs.sort(function(a,b){return a.ts-b.ts;});
        document.getElementById('obs-in').value='';
        S.verUser=null;S.selUser=null;
        document.getElementById('greeting').innerHTML='';
        renderUsers();
        btn.textContent='✓ '+TL[next]+' às '+reg.time;
        setTimeout(function(){btn.disabled=false;updateBtn();},2500);
      });
    }
    if(lat){
      fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json')
        .then(function(r){return r.json();})
        .then(function(d){var a=d.address||{};finalizar(a.city||a.town||a.village||a.county||'Localização capturada');})
        .catch(function(){finalizar(lat.toFixed(5)+', '+lon.toFixed(5));});
    } else finalizar(null);
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){doReg(p.coords.latitude,p.coords.longitude,Math.round(p.coords.accuracy));},function(){doReg(null,null,null);},{timeout:6000});
  } else doReg(null,null,null);
}

function renderHoje(){
  var regs=S.todayRegs.slice().sort(function(a,b){return b.ts-a.ts;});
  document.getElementById('m-reg').textContent=regs.length;
  var pres={};S.todayRegs.filter(function(r){return r.type==='entrada';}).forEach(function(r){pres[r.user]=1;});
  document.getElementById('m-pres').textContent=Object.keys(pres).length;
  var el=document.getElementById('lista-hoje');
  if(!regs.length){el.innerHTML='<div class="empty">Nenhum registro hoje</div>';return;}
  el.innerHTML=regs.map(function(r){

    var loc=locTxt?'<div class="reg-loc">📍 '+esc(locTxt)+'</div>':'';
    var obsHtml='';
    if(S.editObs===r.id){obsHtml='<div class="obs-edit"><textarea rows="2" id="oe-'+r.id+'">'+esc(r.obs||'')+'</textarea><button onclick="saveObs('+r.id+')">Salvar</button><button onclick="S.editObs=null;renderHoje()">Cancelar</button></div>';}
    else if(r.obs){obsHtml='<span class="reg-obs">📝 '+esc(r.obs)+'</span>';}
    return '<div class="reg-item"><div class="reg-top"><div><div class="reg-name">'+esc(r.user)+'</div><div class="reg-time">'+r.time+'</div>'+loc+'</div><div class="reg-acts"><span class="badge '+BC[r.type]+'">'+TL[r.type]+'</span><button class="icon-btn" onclick="S.editObs=S.editObs==='+r.id+'?null:'+r.id+';renderHoje()">'+(r.obs?'✏️':'💬')+'</button></div></div>'+(obsHtml?'<div>'+obsHtml+'</div>':'')+'</div>';
  }).join('');
}

function saveObs(id){
  var val=document.getElementById('oe-'+id).value.trim();
  db.from('registros').update({obs:val||null}).eq('id',id).then(function(res){
    if(res.error){alert('Erro: '+res.error.message);return;}
    S.todayRegs=S.todayRegs.map(function(r){return r.id===id?Object.assign({},r,{obs:val}):r;});

function popFilters(){
  var n=new Date();
  var opts='';
  for(var i=0;i<12;i++){
    var d=new Date(n.getFullYear(),n.getMonth()-i,1);
    var ym=d.getFullYear()+'-'+pad(d.getMonth()+1);

  }
  ['f-mes','af-mes'].forEach(function(id){var el=document.getElementById(id);if(el){var v=el.value;el.innerHTML=opts;if(v)el.value=v;}});
  var uOpts='<option value="todos">Todos</option>'+S.users.map(function(u){return '<option value="'+u+'">'+u+'</option>';}).join('');

}

function calcHoras(regs){
  var tot=0,lastIn=null;
  regs.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(r){
    if(r.type==='entrada'||r.type==='retorno_almoco') lastIn=r.ts;
    if((r.type==='saida_almoco'||r.type==='saida')&&lastIn){tot+=r.ts-lastIn;lastIn=null;}
  });
  return{ms:tot,str:Math.floor(tot/3600000)+'h '+pad(Math.floor((tot%3600000)/60000))+'m'};
}

async function renderRel(){
  var mes=document.getElementById('f-mes').value,user=document.getElementById('f-user').value;
  document.getElementById('lista-rel').innerHTML='<div class="loading">Carregando...</div>';
  var q=db.from('registros').select('*').like('date',mes+'%');
  if(user!=='todos') q=q.eq('user_name',user);
  var res=await q;

}

function renderRelData(el,regs){
  if(!regs.length){el.innerHTML='<div class="empty">Nenhum registro neste período</div>';return;}
  var byU={};regs.forEach(function(r){if(!byU[r.user])byU[r.user]=[];byU[r.user].push(r);});
  el.innerHTML=Object.keys(byU).sort().map(function(u){
    var rs=byU[u],c=calcHoras(rs),dias={};rs.forEach(function(r){dias[r.date]=1;});
    var obsN=rs.filter(function(r){return r.obs;}).length;
    return '<div class="rel-item"><div class="rel-top"><span class="rel-name">'+esc(u)+'</span><span class="rel-h">'+c.str+'</span></div><div class="rel-d">'+Object.keys(dias).length+' dia(s)'+(obsN?' · '+obsN+' obs.':'')+'</div></div>';
  }).join('');
}

async function exportar(adminMode){
  var mes,user;
  if(adminMode){mes=document.getElementById('af-mes').value;user=document.getElementById('af-user').value;}
  else{mes=document.getElementById('f-mes').value;user=document.getElementById('f-user').value;}
  var q=db.from('registros').select('*').like('date',mes+'%');
  if(user!=='todos') q=q.eq('user_name',user);
  var res=await q.order('user_name').order('ts');
  var regs=res.data?res.data.map(normalize):[];
  if(!regs.length){alert('Nenhum registro para exportar.');return;}
  var p=mes.split('-'),nomeMes=MONTHS_EX[parseInt(p[1])-1]+'_'+p[0];
  var byUD={};regs.forEach(function(r){var k=r.user+'|'+r.date;if(!byUD[k])byUD[k]=[];byUD[k].push(r);});
  var hDia={};Object.keys(byUD).forEach(function(k){var c=calcHoras(byUD[k]);hDia[k]=c.ms>0?c.str:'-';});
  var linhas=[['Colaborador','Data','Hora','Tipo','Horas no dia','Localização','Observação']];
  regs.forEach(function(r){
    var dp=r.date.split('-'),k=r.user+'|'+r.date;
    var sorted=byUD[k].slice().sort(function(a,b){return a.ts-b.ts;});
    var isLast=sorted[sorted.length-1].id===r.id;
    var loc=r.address||(r.lat?r.lat.toFixed(6)+', '+r.lon.toFixed(6):'Não capturada');
    linhas.push([r.user,dp[2]+'/'+dp[1]+'/'+dp[0],r.time,TL[r.type],isLast?hDia[k]:'',loc,r.obs||'']);
  });
  var csv='\uFEFF'+linhas.map(function(l){return l.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='ponto_'+nomeMes+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function openPin(key,mode,cb){
  PM.key=key;PM.mode=mode;PM.buf='';PM.first='';PM.cb=cb;
  document.getElementById('pm-err').textContent='';
  var name=key==='__admin__'?'Administrador':key;
  if(mode==='create'){document.getElementById('pm-title').textContent='Criar PIN';document.getElementById('pm-sub').textContent=name+' — escolha 4 dígitos';}
  else{document.getElementById('pm-title').textContent='Olá, '+name+'!';document.getElementById('pm-sub').textContent='Digite seu PIN';}
  updDots();document.getElementById('pin-modal').style.display='flex';
}

function cancelPin(){
  document.getElementById('pin-modal').style.display='none';
  S.selUser=null;S.verUser=null;PM.buf='';
  document.getElementById('greeting').innerHTML='';
  renderUsers();updateBtn();
}

function updDots(){for(var i=0;i<4;i++){document.getElementById('pd'+i).className='pin-dot'+(PM.buf.length>i?' filled':'');}}

function pk(k){
  document.getElementById('pm-err').textContent='';
  if(k==='DEL'){PM.buf=PM.buf.slice(0,-1);updDots();return;}
  if(k==='C'){PM.buf='';updDots();return;}
  if(PM.buf.length>=4) return;
  PM.buf+=k;updDots();
  if(PM.buf.length===4) setTimeout(pinDone,120);
}

function pinDone(){
  if(PM.mode==='create'){
    PM.first=PM.buf;PM.buf='';PM.mode='confirm';
    document.getElementById('pm-title').textContent='Confirmar PIN';
    document.getElementById('pm-sub').textContent='Digite novamente';
    updDots();
  } else if(PM.mode==='confirm'){
    if(PM.buf===PM.first){
      S.pins[PM.key]=PM.buf;localStorage.setItem('ponto_pins',JSON.stringify(S.pins));
      document.getElementById('pin-modal').style.display='none';if(PM.cb)PM.cb();
    } else {
      document.getElementById('pm-err').textContent='PINs não coincidem.';
      PM.buf='';PM.first='';PM.mode='create';
      document.getElementById('pm-title').textContent='Criar PIN';
      document.getElementById('pm-sub').textContent=(PM.key==='__admin__'?'Administrador':PM.key)+' — escolha 4 dígitos';
      updDots();
    }
  } else {
    if(PM.buf===S.pins[PM.key]){document.getElementById('pin-modal').style.display='none';if(PM.cb)PM.cb();}
    else{document.getElementById('pm-err').textContent='PIN incorreto.';PM.buf='';updDots();}
  }
}
</script>
